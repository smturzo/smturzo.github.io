- title: Experience
  type: time_table
  contents:
    - title: Principal Research Scientist
      institution: GSK, Upper Providence, PA
      year: 2026 - present
      description:
        - title: Benchmarking foundation AI models for antibody design
          contents:
            - Designed and executed benchmarking studies of state-of-the-art foundation models for antibody design, evaluating their potential to accelerate development of bispecific, trispecific, and other complex antibody therapeutics.
        - title: De novo model development for antibody discovery
          contents:
            - Leading development of a novel foundation model architecture purpose-built for antibody discovery, optimizing model performance and establishing scaling laws to guide efficient, high-impact training.
        - title: Antibody sequence optimization with quantum chemistry
          contents:
            - Integrating quantum chemistry methods with antibody sequence optimization to capture fine-grained electronic and structural properties that influence binding affinity, stability, and specificity.

    - title: Research Fellow
      institution: Flatiron Institute (Simons Foundation), New York, NY
      year: 2023 - 2026
      description:
        - title: Autonomous agentic workflow for protein and heteropolymer design
          contents:
            - Designed an autonomous LLM agent integrated with the Rosetta modeling suite for iterative protein and heteropolymer design, including non-canonical amino acids and custom geometries. Benchmarked against ML models and human experts with comparable performance on canonical and non-canonical tasks.
        - title: Benchmarking foundation models for structure prediction
          contents:
            - Executed rigorous benchmarking of state-of-the-art foundation models for ternary complex (molecular glue) structure prediction across diverse protein-ligand systems.
        - title: Integrative modeling in cross-company collaboration
          contents:
            - Led integration of foundation-model predictions and perturbation modeling with experimental data in partnership with a biotech startup, working with wet-lab and computational teams to validate models and guide iterative optimization of molecular glue designs.
        - title: Computational protein design for drug discovery
          contents:
            - Designed hinge proteins with tunable domain motions to enable therapeutic mechanism exploration, collaborating with pharmaceutical and academic partners for experimental validation.
        - title: Scientific software engineering
          contents:
            - Engineered core components of the Masala software suite, developing GPU-accelerated therapeutic design algorithms that significantly improved scalability and computational efficiency.
        - title: Computational peptide design
          contents:
            - Built algorithms and workflows integrating Rosetta and quantum chemistry to model and optimize cyclic peptides, supporting potency and stability optimization in therapeutic development programs.

    - title: Research Intern
      institution: Flatiron Institute (Simons Foundation), New York, NY
      year: 2022
      description:
        - Developed a Rosetta application for designing cyclic peptide crosslinkers by optimizing the Rosetta force field against quantum chemistry.

